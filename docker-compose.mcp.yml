services:
  sciclaw-mcp-server:
    build:
      context: ./tools/sciclaw-mcp-server
    restart: unless-stopped
    env_file: ${SCICLAW_MCP_SERVER_ENV_PATH:?set SCICLAW_MCP_SERVER_ENV_PATH}
    environment:
      GITEA_API_BASE_URL: ${GITEA_API_BASE_URL:?set GITEA_API_BASE_URL}
      NODE_EXTRA_CA_CERTS: /certs/CCHMCRootCA.pem
    volumes:
      - ${SCICLAW_MCP_CA_PATH:?set SCICLAW_MCP_CA_PATH}:/certs/CCHMCRootCA.pem:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/health'); if (!r.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 10

  sciclaw-gateway:
    depends_on:
      sciclaw-mcp-server:
        condition: service_healthy
    volumes:
      - ${SCICLAW_CONFIG_PATH:?set SCICLAW_CONFIG_PATH}:/root/.picoclaw/config.json:ro
      - ${SCICLAW_MCP_API_KEY_SECRET_PATH:?set SCICLAW_MCP_API_KEY_SECRET_PATH}:/run/secrets/sciclaw_mcp_api_key:ro
    environment:
      SCICLAW_MCP_URL: http://sciclaw-mcp-server:3000/mcp
      SCICLAW_MCP_API_KEY_FILE: /run/secrets/sciclaw_mcp_api_key
